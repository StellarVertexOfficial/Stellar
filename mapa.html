<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu mapa estelar en PDF — StellarVertex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="cart.css?v=3c2094c4b2">
<style>
:root{--bg:#08090A;--ink:#f2f3f4;--mute:rgba(255,255,255,.55);--line:rgba(255,255,255,.1);--acc:#7DD37D;--gold:#E8B547}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 70% -10%,rgba(232,181,71,.08),transparent 60%),var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;background:rgba(8,9,10,.7);z-index:2}
header b{font-weight:600}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:32px;max-width:1100px;margin:0 auto;padding:32px 24px}
#f{display:flex;min-width:0;flex-direction:column;gap:14px}
#f label{display:flex;min-width:0;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
#f input,#f select{min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:9px 12px;transition:border-color .15s}
#f input:not([type=checkbox]),#f select{width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:hover,select:hover{border-color:rgba(255,255,255,.2)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#f .chk{flex-direction:row;align-items:center;gap:8px}
.themes{display:flex;gap:8px}
.themes button{flex:1;padding:8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px Inter;cursor:pointer;transition:border-color .15s,background .15s}
.themes button[aria-pressed=true]{border-color:var(--acc);background:rgba(125,211,125,.1)}
.go{background:var(--acc);color:#08090A;border:0;border-radius:999px;padding:12px;font:600 14px Inter;cursor:pointer;transition:transform .15s}
.go:hover{transform:scale(1.02)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:11px;font:500 14px Inter;cursor:pointer}
small{font:400 11px/1.4 'JetBrains Mono',monospace;color:var(--mute)}
.view{min-width:0;display:flex;justify-content:center;align-items:flex-start}
canvas{display:block;min-width:0;width:100%;max-width:560px;height:auto;border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media(max-width:820px){
  main{grid-template-columns:minmax(0,1fr);padding:24px 16px;gap:24px}
  .view{order:-1}
}
@media(max-width:480px){
  .row3{grid-template-columns:minmax(0,1fr)}
  #f input,#f select{font-size:16px}
  .themes button,.go,.ghost,header .cart-trigger{min-height:44px}
}
@media(max-width:360px){.row{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <b>StellarVertex</b>
  <button type="button" class="cart-trigger" id="svCartTrigger" aria-label="Ver carrito">
    Carrito <span class="cart-trigger__count hidden" id="svCartCount">0</span>
  </button>
</header>
<main>
<form id="f" onsubmit="return false">
  <label>Título<input id="titulo" value="El cielo de nuestro día" maxlength="40"></label>
  <label>Mensaje<input id="msg" value="Para siempre bajo las mismas estrellas" maxlength="60"></label>
  <div class="row">
    <label>Fecha<input id="fecha" type="date" required max="9999-12-31" value="2024-05-10"></label>
    <label>Hora (opcional)<input id="hora" type="time"></label>
  </div>
  <label>Ciudad
    <select id="ciudad"></select>
  </label>
  <div class="row3">
    <label>Latitud<input id="lat" type="number" required min="-90" max="90" step="any" value="19.43"></label>
    <label>Longitud<input id="lon" type="number" required min="-180" max="180" step="any" value="-99.13"></label>
    <label>UTC<input id="tz" type="number" required min="-12" max="14" step="any" value="-6"></label>
  </div>
  <small>Hora de verano en México (hasta 2022): usa UTC -5 en el centro del país si la fecha cae en abril–octubre.</small>
  <label>Lugar en el mapa<input id="lugar" required value="Ciudad de México" maxlength="40"></label>
  <label class="chk"><input id="lineas" type="checkbox" checked> Mostrar constelaciones</label>
  <div class="themes" role="group" aria-label="Estilo">
    <button type="button" data-t="noche" aria-pressed="true">Noche</button>
    <button type="button" data-t="tinta" aria-pressed="false">Tinta</button>
    <button type="button" data-t="papel" aria-pressed="false">Papel</button>
  </div>
  <button class="go btn-add-cart" id="pedir" type="button" data-open-cart aria-haspopup="dialog" aria-controls="svCartDrawer"
    data-product-id="mapa-pdf" data-product-name="Mapa estelar en PDF" data-product-price="99"
    data-product-icon="📄">Pedir mi PDF · $99 MXN</button>
  <button class="ghost" id="dl" type="button">Descargar vista previa</button>
  <small>La vista previa lleva marca de agua. Tu PDF final es de alta resolución, sin marca y listo para imprimir a 30×40 cm. Si no pones la hora, usamos las 21:00.</small>
</form>
<div class="view"><canvas id="cv" width="1800" height="2400" aria-label="Vista previa del mapa estelar"></canvas></div>
</main>
<script src="stars-data.js"></script>
<script src="mapa-calculo.js"></script>
<script defer src="solana-pay.js"></script>
<script defer src="cart.js?v=2a077437b7"></script>
<script>
const D = window.STELLAR_DATA;
const $ = id => document.getElementById(id);
const { cities, layout, themes, coordinatesForCity, parseDateTime, siderealAngle, project, starRadius, dateLabel, coordinateLabel } = StellarMap;
const { width: W, height: H, cx: CX, cy: CY, radius: R } = layout;
const cv = $('cv');
const ctx = cv.getContext('2d');
let theme = 'noche';
const SANS='Inter, system-ui, sans-serif',MONO='"JetBrains Mono", monospace';
for (const { name } of cities) $('ciudad').add(new Option(name, name));

function fit(txt,w,fam,size,maxW){
  ctx.font=`${w} ${size}px ${fam}`;
  while(ctx.measureText(txt).width>maxW&&size>28){size-=4;ctx.font=`${w} ${size}px ${fam}`}
}
function draw(){
  const t=themes[theme];
  const date = parseDateTime($('fecha').value, $('hora').value || '21:00');
  const location = {lat: $('lat').valueAsNumber, lon: $('lon').valueAsNumber, tz: $('tz').valueAsNumber};
  if (!date || !Object.values(location).every(Number.isFinite)) return;
  const lat = location.lat;
  const lst = siderealAngle(date, location);
  ctx.fillStyle=t.bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=t.disc;ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.clip();
  if($('lineas').checked){
    ctx.strokeStyle=t.line;ctx.globalAlpha=t.lineOpacity;ctx.lineWidth=2;
    for(const seg of D.lines){
      ctx.beginPath();let pen=false;
      for(const [ra,dec] of seg){const p=project(ra,dec,lat,lst);if(!p){pen=false;continue}pen?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);pen=true}
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=t.star;
  for(const [ra,dec,mag] of D.stars){
    const p=project(ra,dec,lat,lst);if(!p)continue;
    ctx.beginPath();ctx.arc(p[0],p[1],starRadius(mag),0,7);ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle=t.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(CX,CY,R+28,0,7);ctx.stroke();
  ctx.fillStyle=t.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`500 34px ${MONO}`;
  ctx.fillText('N',CX,CY-R-70);ctx.fillText('S',CX,CY+R+70);ctx.fillText('E',CX-R-70,CY);ctx.fillText('O',CX+R+70,CY);
  const fecha = dateLabel(date);
  const coords = coordinateLabel(location);
  fit($('titulo').value||' ',700,SANS,120,1400);ctx.fillText($('titulo').value,CX,1960);
  ctx.font=`500 52px ${SANS}`;ctx.fillText(fecha+($('hora').value?' · '+$('hora').value:''),CX,2050);
  ctx.font=`400 34px ${MONO}`;ctx.fillText(`${$('lugar').value}   ${coords}`,CX,2118);
  fit($('msg').value||' ',400,SANS,44,1300);ctx.globalAlpha=.75;ctx.fillText($('msg').value,CX,2220);ctx.globalAlpha=1;
  ctx.save();
  ctx.globalAlpha=.17;
  ctx.fillStyle=t.ink;
  ctx.font=`700 92px ${SANS}`;
  ctx.translate(CX,H/2);
  ctx.rotate(-.5);
  for(let yy=-1700;yy<=1700;yy+=400)ctx.fillText('VISTA PREVIA · STELLARVERTEX',0,yy);
  ctx.restore();
}
$('ciudad').addEventListener('change',e=>{
  const name = e.target.value;
  const { lat, lon, tz } = coordinatesForCity(name);
  $('lat').value = lat;
  $('lon').value = lon;
  $('tz').value = tz;
  $('lugar').value = name;
  draw();
});
document.querySelectorAll('.themes button').forEach(b=>b.addEventListener('click',()=>{
  theme=b.dataset.t;document.querySelectorAll('.themes button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();
}));
$('f').addEventListener('input',draw);
$('dl').addEventListener('click',()=>cv.toBlob(b=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vista-previa-mapa-estelar.png';a.click();URL.revokeObjectURL(a.href);
}));
$('pedir').getMapForCart = () => {
  const lugar = $('lugar').value.trim();
  $('lugar').setCustomValidity(lugar ? '' : 'Escribe el lugar del mapa.');
  if (!$('f').reportValidity()) return null;

  const map = {
    fecha: $('fecha').value,
    hora: $('hora').value || '21:00',
    lugar,
    titulo: $('titulo').value.trim(),
    msg: $('msg').value.trim(),
    estilo: theme,
    coordenadas: {
      lat: $('lat').valueAsNumber,
      lon: $('lon').valueAsNumber,
      tz: $('tz').valueAsNumber,
    },
    lineas: $('lineas').checked,
    horaVisible: Boolean($('hora').value),
  };

  try {
    sessionStorage.setItem('sv_map_draft', JSON.stringify({ ...map, hora: $('hora').value }));
  } catch { /* El carrito también admite pedidos en memoria. */ }
  return map;
};
draw();
Promise.all([document.fonts.load('700 100px Inter'),document.fonts.load('500 40px Inter'),document.fonts.load('400 30px "JetBrains Mono"')]).then(draw);
</script>
</body>
</html>
