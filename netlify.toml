# Configuración de despliegue para StellarVertex
# Con este archivo, Netlify se configura solo al importar el repo —
# no hace falta tocar nada manualmente en la pantalla de "Build settings".

[build]
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/@fontsource/inter/package.json", "node_modules/@fontsource/inter/files/inter-latin-{400,700}-normal.woff"]
